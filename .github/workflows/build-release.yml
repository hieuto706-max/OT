name: Build and Release

on:
  push:
    tags:
      - 'v*' # Chạy khi push tag v1.0.6, v1.0.7...

permissions:
  contents: write

jobs:
  release:
    name: Build & Release App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish Desktop EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- --publish always

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Remove local java.home from gradle.properties
        run: |
          node -e "const fs = require('fs'); const file = 'mobile-android/gradle.properties'; if (fs.existsSync(file)) { const content = fs.readFileSync(file, 'utf8').split('\n').filter(line => !line.startsWith('org.gradle.java.home=')).join('\n'); fs.writeFileSync(file, content); }"

      - name: Build Android APK (Release)
        working-directory: mobile-android
        run: |
          ./gradlew.bat assembleRelease --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          mv mobile-android/app/build/outputs/apk/release/app-release.apk mobile-android/app/build/outputs/apk/release/OT-Manager-mobile.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-android/app/build/outputs/apk/release/OT-Manager-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Sync Web Content to iOS www/
        run: |
          cp mobile/index.html mobile-ios/OTManager/www/index.html
          cp mobile/app.js mobile-ios/OTManager/www/app.js
          cp mobile/style.css mobile-ios/OTManager/www/style.css
          cp mobile/download.html mobile-ios/OTManager/www/download.html
          cp mobile/manifest.json mobile-ios/OTManager/www/manifest.json
          cp mobile/icon-192.png mobile-ios/OTManager/www/icon-192.png

      - name: Build iOS App (Simulator)
        working-directory: mobile-ios
        run: |
          xcodebuild -project OTManager.xcodeproj \
            -scheme OTManager \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS App (Device Unsigned)
        working-directory: mobile-ios
        run: |
          xcodebuild -project OTManager.xcodeproj \
            -scheme OTManager \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build_device \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_REQUIRED=NO \
            build

      - name: Package iOS App
        run: |
          # Package Simulator
          cd mobile-ios/build/Build/Products/Release-iphonesimulator
          zip -r ../../../../OTManager-iOS-Simulator.zip OTManager.app
          cd ../../../..
          
          # Package Device IPA
          mkdir -p Payload
          cp -r mobile-ios/build_device/Build/Products/Release-iphoneos/OTManager.app Payload/
          zip -r OT-Manager-mobile.ipa Payload

      - name: Upload iOS App to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile-ios/OTManager-iOS-Simulator.zip
            OT-Manager-mobile.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
