name: Build and Release

on:
  push:
    tags:
      - 'v*' # Chạy khi push tag v1.0.6, v1.0.7...

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish Desktop EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- --publish always

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle Packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Remove local java.home from gradle.properties
        run: |
          node -e "const fs = require('fs'); const file = 'mobile-android/gradle.properties'; if (fs.existsSync(file)) { const content = fs.readFileSync(file, 'utf8').split('\n').filter(line => !line.startsWith('org.gradle.java.home=')).join('\n'); fs.writeFileSync(file, content); }"

      - name: Build Android APK (Release)
        working-directory: mobile-android
        run: |
          ./gradlew.bat assembleRelease --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          mv mobile-android/app/build/outputs/apk/release/app-release.apk mobile-android/app/build/outputs/apk/release/OT-Manager-mobile.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-android/app/build/outputs/apk/release/OT-Manager-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
