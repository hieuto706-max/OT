<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d1f18"/>
            <stop offset="50%" stop-color="#040b08"/>
            <stop offset="100%" stop-color="#010403"/>
        </linearGradient>

        <!-- Outer Ring Glow Gradient -->
        <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0dd98b"/>
            <stop offset="50%" stop-color="#00f2fe"/>
            <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>

        <!-- Inner Clock/Plus Icon Gradient -->
        <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#a7f3d0"/>
        </linearGradient>

        <!-- Glassmorphism Ring Gradient -->
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
        </linearGradient>

        <!-- Glow Filter -->
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="16" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>

    <!-- Outer Squircle Body -->
    <rect x="16" y="16" width="480" height="480" rx="130" fill="url(#bgGrad)" stroke="url(#glassGrad)" stroke-width="4" filter="url(#softShadow)"/>

    <!-- Glowing Active Border -->
    <rect x="28" y="28" width="456" height="456" rx="118" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-opacity="0.6"/>

    <!-- Decorative Tech Dots (Top-Right & Bottom-Left) -->
    <circle cx="410" cy="102" r="6" fill="#0dd98b" opacity="0.8" filter="url(#neonGlow)"/>
    <circle cx="102" cy="410" r="4" fill="#3b82f6" opacity="0.6"/>
    
    <!-- Outer Orbiting Ring (Clock Dial Outline) -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-dasharray="600 200" transform="rotate(-45 256 256)" filter="url(#neonGlow)"/>
    
    <!-- Outer Ring Glass Inner Fill -->
    <circle cx="256" cy="256" r="140" fill="url(#glassGrad)"/>

    <!-- The Hour Markers (Tech Style) -->
    <line x1="256" y1="130" x2="256" y2="140" stroke="#0dd98b" stroke-width="5" stroke-linecap="round"/>
    <line x1="382" y1="256" x2="372" y2="256" stroke="#00f2fe" stroke-width="5" stroke-linecap="round"/>
    <line x1="256" y1="382" x2="256" y2="372" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
    <line x1="130" y1="256" x2="140" y2="256" stroke="#0dd98b" stroke-width="5" stroke-linecap="round"/>

    <!-- Stylized Lightning Clock Hand (T) & Plus (+) Symbol Center -->
    <g transform="translate(256, 256)" filter="url(#neonGlow)">
        <!-- Center core dot -->
        <circle cx="0" cy="0" r="12" fill="#ffffff"/>
        
        <!-- Hour Hand (Mint Green, pointing at 9) -->
        <path d="M -12,0 L -75,0" stroke="#0dd98b" stroke-width="12" stroke-linecap="round"/>
        
        <!-- Minute Hand (Lightning Bolt Shape, pointing up-right at 1/2) -->
        <path d="M 0,-12 L 0,-60 L 25,-40 L 15,-100" fill="none" stroke="url(#iconGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Overtime Plus Badge indicator inside the clock (Top Right area) -->
        <g transform="translate(68, -68)">
            <circle cx="0" cy="0" r="28" fill="#0dd98b" filter="url(#neonGlow)"/>
            <!-- Plus Sign inside badge -->
            <path d="M -12,0 L 12,0 M 0,-12 L 0,12" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
        </g>
    </g>

    <!-- Subtext or Brand Initials at the bottom -->
    <text x="256" y="440" font-family="'Outfit', 'Inter', sans-serif" font-size="34" font-weight="900" fill="url(#glowGrad)" text-anchor="middle" letter-spacing="8" opacity="0.9">OT MANAGER</text>
</svg>
