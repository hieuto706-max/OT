services:
  - type: web
    name: ot-manager-server
    env: node
    plan: starter
    buildCommand: npm install --production
    startCommand: node server/server.js
    disk:
      name: ot-manager-db
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: DB_PATH
        value: /data/db.json
      - key: GIST_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
